name: Prepare
description: Node, the validation impact of this change, dependencies and browsers.

inputs:
  browsers:
    description: Playwright browsers to install with their system libraries, space separated. Empty installs none.
    default: ""
  packages:
    description: Further apt packages to install alongside the browsers (for example pulseaudio), space separated. Needs browsers.
    default: ""

outputs:
  full:
    description: "'false' only when this change was classified as documentation-only; every other value means validate everything."
    value: ${{ steps.classify.outputs.full }}

runs:
  using: composite
  steps:
    - name: Fetch pull-request base
      if: github.base_ref
      shell: bash
      run: git fetch --no-tags --depth=1 origin +refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 24
        cache: npm
    - name: Classify validation impact
      id: classify
      shell: bash
      run: node scripts/ci-impact.mjs
    - name: Install dependencies
      if: steps.classify.outputs.full != 'false'
      shell: bash
      run: npm ci

    # Browsers and their system packages are cached. The packages come from the
    # runner's apt mirror, which at times serves a few dozen KB/s: uncached,
    # one install could outlast a job's timeout. Caches made on the default
    # branch (see warm-caches.yml) are readable by every pull request.
    - name: Name the browser caches
      id: cache-keys
      if: steps.classify.outputs.full != 'false' && inputs.browsers != ''
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        PACKAGES: ${{ inputs.packages }}
      run: |
        playwright=$(node -p "require('playwright-core/package.json').version")
        browsers=$(echo $BROWSERS | tr ' ' '-')
        packages=$(echo $BROWSERS $PACKAGES | tr ' ' '-')
        {
          echo "browsers=playwright-$ImageOS-$playwright-$browsers"
          echo "packages=apt-$ImageOS-$ImageVersion-$packages"
          echo "packages-image=apt-$ImageOS-$ImageVersion-"
          echo "packages-os=apt-$ImageOS-"
        } >> "$GITHUB_OUTPUT"
    - name: Restore browsers
      id: restore-browsers
      if: steps.cache-keys.outcome == 'success'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.cache-keys.outputs.browsers }}
    - name: Restore system packages
      id: restore-packages
      if: steps.cache-keys.outcome == 'success'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/apt-archives
        key: ${{ steps.cache-keys.outputs.packages }}
        # An older image's packages still cover most of a newer one; apt
        # downloads only what changed.
        restore-keys: |
          ${{ steps.cache-keys.outputs.packages-image }}
          ${{ steps.cache-keys.outputs.packages-os }}
    - name: Install browsers
      if: steps.cache-keys.outcome == 'success'
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        PACKAGES: ${{ inputs.packages }}
      run: |
        # apt keeps what it downloads and starts from the restored packages.
        printf '%s\n' 'APT::Keep-Downloaded-Packages "true";' 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
          | sudo tee /etc/apt/apt.conf.d/99keep-downloads > /dev/null
        archives="$HOME/.cache/apt-archives"
        mkdir -p "$archives"
        if compgen -G "$archives/*.deb" > /dev/null; then
          sudo cp "$archives"/*.deb /var/cache/apt/archives/
        fi
        node node_modules/playwright-core/cli.js install --with-deps $BROWSERS
        if [ -n "$PACKAGES" ]; then
          sudo apt-get install --yes --no-install-recommends $PACKAGES
        fi
        # Keep only the packages now installed, so the cache never grows with
        # versions this image no longer uses.
        dpkg-query -W -f='${Package}_${Version}_${Architecture}.deb\n' \
          | sed 's/:/%3a/g' > "$RUNNER_TEMP/installed-debs"
        rm -rf "$archives" && mkdir -p "$archives"
        for deb in /var/cache/apt/archives/*.deb; do
          [ -e "$deb" ] || continue
          if grep -qxF "$(basename "$deb")" "$RUNNER_TEMP/installed-debs"; then
            cp "$deb" "$archives/"
          fi
        done
        echo "Cached $(ls "$archives" | wc -l) system packages ($(du -sh "$archives" | cut -f1))."
    # Saved right after the install, so a failing suite later in the job still
    # leaves the next run a warm cache.
    - name: Save system packages
      if: steps.restore-packages.outcome == 'success' && steps.restore-packages.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/apt-archives
        key: ${{ steps.cache-keys.outputs.packages }}
    - name: Save browsers
      if: steps.restore-browsers.outcome == 'success' && steps.restore-browsers.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.cache-keys.outputs.browsers }}
