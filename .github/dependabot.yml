version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - framer-motion
          - playwright-core
        update-types:
          - minor
          - patch
      motion-minor-patch:
        patterns:
          - framer-motion
        update-types:
          - minor
          - patch
      playwright-patch:
        patterns:
          - playwright-core
        update-types:
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # Browser minor releases intentionally require a reviewed baseline migration.
      - dependency-name: playwright-core
        update-types:
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
