version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - next
          - eslint-config-next
          - framer-motion
          - lucide-react
          - playwright-core
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch
      next-minor-patch:
        patterns:
          - next
          - eslint-config-next
        update-types:
          - minor
          - patch
      motion-minor-patch:
        patterns:
          - framer-motion
        update-types:
          - minor
          - patch
      lucide-patch:
        patterns:
          - lucide-react
        update-types:
          - patch
      react-patch:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - patch
      playwright-patch:
        patterns:
          - playwright-core
        update-types:
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # React minor releases can change runtime/bundle behavior; keep them manual.
      - dependency-name: react
        update-types:
          - version-update:semver-minor
      - dependency-name: react-dom
        update-types:
          - version-update:semver-minor
      - dependency-name: "@types/react"
        update-types:
          - version-update:semver-minor
      - dependency-name: "@types/react-dom"
        update-types:
          - version-update:semver-minor
      # Lucide minors can change icon geometry and route bundle composition.
      - dependency-name: lucide-react
        update-types:
          - version-update:semver-minor
      # Browser minor releases intentionally require a reviewed baseline migration.
      - dependency-name: playwright-core
        update-types:
          - version-update:semver-minor

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
