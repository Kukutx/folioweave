name: Demos

# Keeps the three public demos on the code that main carries. Each demo is an
# isolated snapshot with a demo profile; no author profile is read or deployed.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demos
  cancel-in-progress: true

jobs:
  deploy:
    # Off until a maintainer opts in and supplies the token: docs/DEPLOYMENT.md.
    if: vars.DEMO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        demo: [classic, light, dark]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global vercel@54.9.0
      - name: Deploy the ${{ matrix.demo }} demo
        run: npm run demo:deploy -- ${{ matrix.demo }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
