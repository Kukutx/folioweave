name: Music diagnostics

# Temporary: runs only the music quality suite on the CI image, to read how
# Firefox reports playback there. Removed once the suite passes in CI.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: music-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright-core/cli.js install --with-deps chromium firefox webkit
      - run: npm run qa:music-quality
