    <!-- spool -->
    <rect x="300" y="300" width="200" height="40" rx="6"/>
    <rect x="300" y="560" width="200" height="40" rx="6"/>
    <path d="M330 340v220M470 340v220"/>
    <path d="M330 370h140M330 400h140M330 430h140M330 460h140M330 490h140M330 520h140" stroke-width="3" opacity="0.55"/>
